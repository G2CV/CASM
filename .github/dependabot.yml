version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - python

  - package-ecosystem: gomod
    directory: /hands
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - go
